name: Upstream monitor

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report upstream changes without changing the tracker issue
        required: false
        default: false
        type: boolean

concurrency:
  group: upstream-monitor
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Check upstream commits
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout monitor configuration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check upstream
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          UPSTREAM_MONITOR_DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: node .github/scripts/upstream-monitor.mjs
